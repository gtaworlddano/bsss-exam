<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LSSD - Basic Sergeant Supervisory School - Entrance Examination</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --lssd-gold: #c5a059;
      --lssd-gold-dark: #9a7836;
      --bg-dark: #0b0f12;
      --card-bg: #141a1f;
      --card-inner: #1a2229;
      --text-main: #e2e8f0;
      --text-muted: #8b9bb0;
      --border-color: #273544;
      --pass: #22c55e;
      --fail: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(11, 15, 18, 0.95), rgba(11, 15, 18, 0.95));
    }

    .wrapper { width: 100%; max-width: 860px; }

    .dept-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--lssd-gold);
      padding-bottom: 1.25rem;
    }
    .dept-badge {
      font-family: 'Cinzel', serif;
      color: var(--lssd-gold);
      letter-spacing: 0.15em;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .dept-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .dept-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.4rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      margin-bottom: 0.45rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--lssd-gold);
    }
    
    #assignment {
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em;
    }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .exam-section { display: none; }
    .applicant-banner {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      font-size: 0.85rem;
    }
    .applicant-banner span { color: var(--lssd-gold); font-weight: 600; }

    .section-separator {
      margin: 2.25rem 0 0.5rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--lssd-gold);
      color: var(--lssd-gold);
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }

    .question-block {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .question-tag {
      font-size: 0.75rem;
      color: var(--lssd-gold);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }
    .question-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      background: rgba(11, 15, 18, 0.6);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s ease-in-out;
    }
    .option-label:hover {
      background: rgba(197, 160, 89, 0.06);
      border-color: var(--border-color);
    }
    .option-label input { margin-top: 0.2rem; }

    .matching-row {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1rem;
      align-items: center;
      padding: 0.75rem;
      background: rgba(11, 15, 18, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .matching-prompt {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(180deg, var(--lssd-gold), var(--lssd-gold-dark));
      color: #0b0f12;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    #status {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--card-bg);
      border: 2px solid var(--lssd-gold);
      border-radius: 8px;
      max-width: 520px;
      width: 90%;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      text-align: center;
    }
    .modal-card h2 {
      font-family: 'Cinzel', serif;
      color: var(--lssd-gold);
      font-size: 1.25rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .modal-warning-text {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--fail);
      color: #fca5a5;
      padding: 1.25rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .modal-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--lssd-gold);
      color: #0b0f12;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .modal-btn:hover { filter: brightness(1.1); }

    @media (max-width: 700px) {
      .matching-row { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="dept-header">
    <div class="dept-badge">Los Santos County Sheriff's Department</div>
    <div class="dept-title">Basic Sergeant Supervisory School - Entrance Examination</div>
    <div class="dept-sub">Advanced Officer Training Unit</div>
  </div>

  <div id="authSection" class="card">
    <form id="authForm">
      <div class="grid-2">
        <div class="form-group">
          <label for="cadetName">Full Name *</label>
          <input type="text" id="cadetName" required placeholder="e.g. Marcus Vance">
        </div>
        <div class="form-group">
          <label for="badgeNumber">Badge / Employee Number *</label>
          <input type="text" id="badgeNumber" required placeholder="e.g. 48821">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="rank">Current Rank / Classification *</label>
          <select id="rank" required>
            <option value="" disabled selected>-- Select Rank --</option>
            <option value="Deputy Sheriff">Deputy Sheriff</option>
            <option value="Deputy Sheriff (Bonus I)">Deputy Sheriff (Bonus I / FTO)</option>
            <option value="Deputy Sheriff (Bonus II)">Deputy Sheriff (Bonus II / Master FTO)</option>
            <option value="Acting Sergeant">Acting Sergeant</option>
          </select>
        </div>
        <div class="form-group">
          <label for="assignment">Assignment Abbreviation [2-3 Letters Only] *</label>
          <input type="text" id="assignment" required maxlength="3" minlength="2" placeholder="CPD" style="text-transform: uppercase;">
        </div>
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">Authenticate &amp; Continue</button>
    </form>
  </div>

  <div id="examSection" class="card exam-section">
    <div class="applicant-banner">
      <div>Candidate: <span id="dispName"></span> (<span id="dispBadge"></span>)</div>
      <div>Assignment: <span id="dispStation"></span></div>
    </div>

    <form id="quizForm">
      <div id="questionsContainer"></div>
      <button type="submit" id="submitBtn" class="btn-primary">Submit Examination</button>
      <div id="status"></div>
    </form>
  </div>
</div>

<div id="warningModal" class="modal-overlay">
  <div class="modal-card">
    <h2>Examination Notice</h2>
    <div class="modal-warning-text">
      (( Please do not refresh the next page or you will lose your data. ))
    </div>
    <button id="modalConfirmBtn" class="modal-btn">I Understand &amp; Begin</button>
  </div>
</div>

  const examStructure = [
    {
      sectionTitle: "SECTION A - MULTIPLE CHOICE (30 QUESTIONS)",
      questions: [
        { id: "mcq_1", type: "mcq", points: 1, prompt: "1. As a supervisor, your authority must always be exercised:", options: ["In accordance with long-standing operational customs unless emergent conditions justify deviation for efficiency", "Only after informal consultation with command personnel to ensure strategic alignment", "In a manner calibrated to maintain existing working relationships to prevent unnecessary conflict within the unit", "Impartially, without personal attitudes influencing decisions"], correct: "Impartially, without personal attitudes influencing decisions" },
        { id: "mcq_2", type: "mcq", points: 1, prompt: "2. Off-duty supervisors encountering an incident must:", options: ["Assume command authority if the on-duty deputy has not yet articulated a plan of action", "Offer guidance or direction only if the deputies appear uncertain or inexperienced", "Assist strictly in the capacity of a deputy and not assert supervisory authority", "Secure the scene and coordinate units until an on-duty supervisor explicitly relieves them"], correct: "Assist strictly in the capacity of a deputy and not assert supervisory authority" },
        { id: "mcq_3", type: "mcq", points: 1, prompt: "3. Supervisors should avoid:", options: ["Responding to emerging incidents unless prior approval is obtained from command staff", "Taking the handle on routine calls unless an immediate safety or tactical need requires supervisory intervention", "Refraining from monitoring pursuits unless the offense is violent or the suspect is known to be armed", "Declining to review reports unless deficiencies rise to the level of potential misconduct"], correct: "Taking the handle on routine calls unless an immediate safety or tactical need requires supervisory intervention" },
        { id: "mcq_4", type: "mcq", points: 1, prompt: "4. A deputy initiates a pursuit for expired registration; speeds exceed 120 mph in dense traffic. The supervisor should:", options: ["Cancel the pursuit immediately due to disproportionate risk to the public", "Allow continuation if the deputy has advanced tactical driving credentials verified by training staff", "Direct additional units to form a rolling perimeter to gradually restrict the suspect's movement", "Defer the decision until the Watch Commander evaluates pursuit telemetry and traffic conditions"], correct: "Cancel the pursuit immediately due to disproportionate risk to the public" },
        { id: "mcq_5", type: "mcq", points: 1, prompt: "5. When joining a pursuit, the supervisor's first duty is to:", options: ["Establish tactical parameters, including pre-authorizing PIT and spike-strip deployment to streamline decision cycles", "Establish essential facts: reason, vehicle, traffic, weather, speed, weapons", "Assume primary pursuit to centralize communications for scene clarity", "Obtain the initiating deputy's preferred tactical plan to maintain continuity"], correct: "Establish essential facts: reason, vehicle, traffic, weather, speed, weapons" },
        { id: "mcq_6", type: "mcq", points: 1, prompt: "6. A known suspect with a verified home address is fleeing at dangerous speeds with an air unit overhead. Supervisor should:", options: ["Continue full vehicular pursuit to preserve operational dominance and avoid losing visual contact", "Authorize PIT based on the suspect's high-risk driving and known criminal history", "Deploy spike strips preemptively on all exit routes, despite speed and roadway complexity", "Terminate ground pursuit and transition to surveillance mode"], correct: "Terminate ground pursuit and transition to surveillance mode" },
        { id: "mcq_7", type: "mcq", points: 1, prompt: "7. During a felony stop, extraction must occur:", options: ["By directing a simultaneous mass extraction to minimize extended roadway exposure", "One suspect at a time, fully secured before the next", "Only after verifying SEB availability when subjects appear noncompliant", "With deputies repositioned into open lanes if improved angles of fire are required"], correct: "One suspect at a time, fully secured before the next" },
        { id: "mcq_8", type: "mcq", points: 1, prompt: "8. A K-9 is shot during a foot pursuit. The supervisory response is to:", options: ["Classify it as a standard reportable injury and allow the handler to determine medical priorities", "Require only a supplemental memorandum unless the injury is fatal", "Treat it as a deputy-injury emergency and activate critical incident protocols", "Direct personnel to continue suspect search operations before rendering aid"], correct: "Treat it as a deputy-injury emergency and activate critical incident protocols" },
        { id: "mcq_9", type: "mcq", points: 1, prompt: "9. First action in a blue-on-blue encounter:", options: ["Place all involved personnel in restraints to establish scene control", "Immediately withdraw personnel from the area to avoid further confusion", "Immediately cease all force and identify personnel", "Request immediate SEB intervention before taking action"], correct: "Immediately cease all force and identify personnel" },
        { id: "mcq_10", type: "mcq", points: 1, prompt: "10. A deputy deploys a 40mm round. Supervisor must:", options: ["Respond, confirm medical aid, assess policy compliance, and route reports", "Defer intervention until specialized force investigators authorize supervisory review", "Relieve the deputy from duty immediately pending full command review", "Reassure involved parties that the deployment will be automatically classified as justified"], correct: "Respond, confirm medical aid, assess policy compliance, and route reports" },
        { id: "mcq_11", type: "mcq", points: 1, prompt: "11. When a member of the public requests a supervisor at a stop, the supervisor must:", options: ["Decline unless the deputy involved indicates that supervisory presence would be beneficial to scene management", "Hear all sides, document, and accept the complaint if requested", "Provide on-scene disciplinary assurances to restore public trust", "Criticize the deputy publicly to demonstrate transparency in oversight"], correct: "Hear all sides, document, and accept the complaint if requested" },
        { id: "mcq_12", type: "mcq", points: 1, prompt: "12. In a deputy-involved shooting, supervisors must:", options: ["Allow involved deputies to communicate in order to reconcile their recollections before formal statements", "Direct deputies to write initial reports prior to scene stabilization to preserve accuracy", "Conduct witness interviews personally to streamline the investigative process", "Separate involved deputies, secure the scene, ensure medical aid, and make required notifications"], correct: "Separate involved deputies, secure the scene, ensure medical aid, and make required notifications" },
        { id: "mcq_13", type: "mcq", points: 1, prompt: "13. During SEB operations, the patrol supervisor's role is to:", options: ["Integrate into the breach team to maintain supervisory oversight", "Develop and execute an alternative entry plan in case SEB's plan fails", "Maintain containment, manage outer tasks, and coordinate with SEB", "Withdraw from the incident to avoid operational redundancy"], correct: "Maintain containment, manage outer tasks, and coordinate with SEB" },
        { id: "mcq_14", type: "mcq", points: 1, prompt: "14. Debriefs for critical incidents must:", options: ["Happen immediately when reasonably possible and involve all available personnel", "Occur only when a deputy expresses confusion or dissatisfaction with tactics used", "Be omitted unless deadly force occurred or a major injury resulted", "Occur exclusively by the Watch Commander to ensure uniformity across shifts"], correct: "Happen immediately when reasonably possible and involve all available personnel" },
        { id: "mcq_15", type: "mcq", points: 1, prompt: "15. The purpose of discipline is to:", options: ["Implement punitive sanctions aimed at deterring all future errors by the deputy", "Correct behavior and ensure effective operations", "Serve as a means of insulating supervisors from future liability", "Reduce administrative workload by discouraging repeated counseling"], correct: "Correct behavior and ensure effective operations" },
        { id: "mcq_16", type: "mcq", points: 1, prompt: "16. Written Reprimands:", options: ["Have no bearing on future assignment or promotion decisions", "Do not require written delivery to the employee as long as supervisor explains verbally", "Are used exclusively for criminal or integrity-related violations", "Document misconduct and expectations for improvement"], correct: "Document misconduct and expectations for improvement" },
        { id: "mcq_17", type: "mcq", points: 1, prompt: "17. When evaluating discipline, supervisors must consider:", options: ["Intent, history, culpability, severity, honesty, public trust", "The collective opinion of peers on whether the deputy deserves leniency", "The quality of the supervisor-deputy relationship and potential friction", "Internal politics, morale concerns, and potential fallout within the unit"], correct: "Intent, history, culpability, severity, honesty, public trust" },
        { id: "mcq_18", type: "mcq", points: 1, prompt: "18. Terry v. Ohio authorizes supervisors to:", options: ["Allow deputies to frisk anyone who appears uncooperative to ensure officer safety", "Permit pat-downs only when reasonable suspicion exists that the individual is armed", "Conduct automatic searches on all associates of a suspect", "Detain subjects for extended periods to fully investigate without developing further suspicion"], correct: "Permit pat-downs only when reasonable suspicion exists that the individual is armed" },
        { id: "mcq_19", type: "mcq", points: 1, prompt: "19. Tennessee v. Garner permits deadly force when:", options: ["The fleeing individual committed any felony that demonstrates disregard for lawful authority", "The suspect is resisting commands, regardless of threat level", "The suspect directs verbal aggression or insults toward deputies", "The suspect fleeing poses imminent threat of death or serious bodily harm"], correct: "The suspect fleeing poses imminent threat of death or serious bodily harm" },
        { id: "mcq_20", type: "mcq", points: 1, prompt: "20. Mapp v. Ohio requires supervisors to:", options: ["Permit seizure of all items related to the investigation, even if outside lawful scope", "Treat all warrantless entries as presumptively lawful if exigency is claimed", "Exclude evidence obtained illegally or without lawful cause", "Expand search authority whenever a suspect attempts to conceal items from deputies"], correct: "Exclude evidence obtained illegally or without lawful cause" },
        { id: "mcq_21", type: "mcq", points: 1, prompt: "21. Miranda v. Arizona requires deputies to:", options: ["Provide warnings only after formal arrest documents are completed", "Provide Miranda warnings before custodial interrogation", "Provide warnings during any substantive interaction, even non-custodial", "Avoid providing warnings to juveniles unless guardian is present"], correct: "Provide Miranda warnings before custodial interrogation" },
        { id: "mcq_22", type: "mcq", points: 1, prompt: "22. For hot pursuit into a home, the supervisor must confirm:", options: ["That any misdemeanor pursuit qualifies for immediate home-entry authority", "That the time of day permits tactical flexibility without compromising public safety", "Exigent need, fresh pursuit, and threat level justifying immediate entry", "That the deputy feels unsafe and prefers to continue pursuit indoors"], correct: "Exigent need, fresh pursuit, and threat level justifying immediate entry" },
        { id: "mcq_23", type: "mcq", points: 1, prompt: "23. Deputies request permission to spike a fleeing motorcycle. Supervisor should:", options: ["Deny unless deadly force is justified, due to high lethality risk", "Approve only when suspect speeds are minimal and traffic is light", "Approve to prevent the suspect from reaching higher-speed roadways", "Defer the decision to SCC based on dispatch's risk assessment"], correct: "Deny unless deadly force is justified, due to high lethality risk" },
        { id: "mcq_24", type: "mcq", points: 1, prompt: "24. A deputy attempts a PIT at 95 mph in a downtown corridor. Supervisor must:", options: ["Approve due to the severity and need to stop the suspect immediately", "Approve if the deputy insists on taking responsibility for the maneuver", "Deny due to extreme risk and the unsafe urban environment", "Request that SEB perform the PIT, as they are exempt from speed limitations"], correct: "Deny due to extreme risk and the unsafe urban environment" },
        { id: "mcq_25", type: "mcq", points: 1, prompt: "25. A deputy demands to question a 14-year-old without counsel present. Supervisor should:", options: ["Allow questioning unless the juvenile directly requests counsel", "Permit questioning with parental consent regardless of juvenile age", "Deny; juveniles 15 or younger must consult counsel", "Question the juvenile personally to expedite the investigation"], correct: "Deny; juveniles 15 or younger must consult counsel" },
        { id: "mcq_26", type: "mcq", points: 1, prompt: "26. During an officer-involved shooting, a supervisor separates involved deputies to:", options: ["Punish them for tactical errors", "Prevent discussion and preserve the integrity of their independent statements", "Create physical distance solely to avoid emotional escalation", "Reduce the volume of paperwork by limiting follow-up interviews"], correct: "Prevent discussion and preserve the integrity of their independent statements" },
        { id: "mcq_27", type: "mcq", points: 1, prompt: "27. A deputy suggests boxing in a fleeing vehicle. Supervisor must:", options: ["Approve if multiple units are present and traffic conditions are controlled", "Deny during daylight hours when visibility is optimal", "Approve if the roadway is largely empty and the speed is moderate", "Deny; boxing-in is prohibited for patrol operations"], correct: "Deny; boxing-in is prohibited for patrol operations" },
        { id: "mcq_28", type: "mcq", points: 1, prompt: "28. A deputy requests authorization for a PIT at 42 mph in light traffic. Unknown to them, the suspect had brandished a firearm earlier. Supervisor must:", options: ["Deny PIT because lower speeds reduce risk", "Authorize PIT if additional units are positioned to assist", "Deny PIT; armed suspects present increased lethal risk to PIT officers", "Allow PIT since the initial offense involved a violent element"], correct: "Deny PIT; armed suspects present increased lethal risk to PIT officers" },
        { id: "mcq_29", type: "mcq", points: 1, prompt: "29. A deputy deploys a taser near spilled gasoline. Supervisor must:", options: ["Approve since tasers are less lethal", "Permit deployment if the subject is combative and resisting", "Immediately stop deployment due to flammability hazard", "Request air support approval before making a decision"], correct: "Immediately stop deployment due to flammability hazard" },

        { id: "tf_6", type: "tf", points: 1, prompt: "6. Supervisors should avoid performing line-level duties unless immediate safety requires intervention.", options: ["True", "False"], correct: "True" },
        { id: "tf_7", type: "tf", points: 1, prompt: "7. During a use-of-force review, supervisors must confirm whether medical aid was provided, even if the suspect refused treatment.", options: ["True", "False"], correct: "True" },
        { id: "tf_8", type: "tf", points: 1, prompt: "8. A supervisor may authorize spike strips before confirming pursuit conditions if the suspect has committed a violent felony.", options: ["True", "False"], correct: "False" },
        { id: "tf_9", type: "tf", points: 1, prompt: "9. Supervisors must document attempts to resolve policy violations, even when the issue was successfully corrected verbally.", options: ["True", "False"], correct: "True" },
        { id: "tf_10", type: "tf", points: 1, prompt: "10. A supervisor may bypass progressive discipline if the misconduct is severe enough to warrant higher action immediately.", options: ["True", "False"], correct: "True" },
        { id: "tf_11", type: "tf", points: 1, prompt: "11. A deputy who denies responsibility for misconduct may be subject to stronger discipline due to aggravating factors.", options: ["True", "False"], correct: "True" },
        { id: "tf_12", type: "tf", points: 1, prompt: "12. Supervisors may move evidence at a shooting scene if it helps traffic flow, provided they document the change.", options: ["True", "False"], correct: "False" },
        { id: "tf_13", type: "tf", points: 1, prompt: "13. SEB containment must be supported by patrol supervisors, who remain responsible for coordinating the outer perimeter.", options: ["True", "False"], correct: "True" },
        { id: "tf_14", type: "tf", points: 1, prompt: "14. A supervisor may direct deputies to conduct a pat-down solely because the subject seems \"nervous\".", options: ["True", "False"], correct: "False" },
        { id: "tf_15", type: "tf", points: 1, prompt: "15. Supervisors must intervene if a deputy violates radio policy, even if SCC has already corrected the deputy once.", options: ["True", "False"], correct: "True" },
        { id: "tf_16", type: "tf", points: 1, prompt: "16. Supervisors may issue on-scene discipline as long as it is proportionate and documented afterwards.", options: ["True", "False"], correct: "False" },
        { id: "tf_17", type: "tf", points: 1, prompt: "17. It is acceptable to return fire with a less-lethal weapon when being shot at.", options: ["True", "False"], correct: "False" },
        { id: "tf_18", type: "tf", points: 1, prompt: "18. It is acceptable to stand idle at an ongoing incident if there is no space to help apprehend suspects.", options: ["True", "False"], correct: "False" },
        { id: "tf_19", type: "tf", points: 1, prompt: "19. Supervisors should use personal attitudes to influence decisions when they believe it is for the best interest of the Department.", options: ["True", "False"], correct: "False" },
        { id: "tf_20", type: "tf", points: 1, prompt: "20. A supervisor can use their personal devices to record interactions during a supervisor request if their Department-authorized system is not working.", options: ["True", "False"], correct: "False" }
      ]
    },
    {
      sectionTitle: "SECTION C - MATCHING SET 1 (10 QUESTIONS)",
      questions: [
        {
          id: "match_set_1",
          type: "matching",
          points: 10,
          prompt: "Matching Set 1 - Case Law, Force Concepts, and Legal Thresholds",
          pairs: [
            { id: "m1_1", term: "1. Terry v. Ohio", definition: "Allows stop-and-frisk based on reasonable suspicion for weapons." },
            { id: "m1_2", term: "2. Mapp v. Ohio", definition: "Evidence obtained unlawfully is inadmissible in court" },
            { id: "m1_3", term: "3. Miranda v. Arizona", definition: "Requires advising suspects of rights before custodial interrogation." },
            { id: "m1_4", term: "4. Tennessee v. Garner", definition: "Forbids deadly force against fleeing suspect unless imminent threat exists." },
            { id: "m1_5", term: "5. Whren v. United States", definition: "Traffic violations justify traffic stops regardless of officer motive" },
            { id: "m1_6", term: "6. Chimel v. California", definition: "Searches beyond immediate control require warrant or exception" },
            { id: "m1_7", term: "7. Brendlin v. California", definition: "Passengers are seized during traffic stops" },
            { id: "m1_8", term: "8. Objective Force Standard", definition: "Objective reasonableness under totality of circumstances" },
            { id: "m1_9", term: "9. De-escalation Requirement", definition: "Duty to reduce necessity for force when feasible" },
            { id: "m1_10", term: "10. Standard Duty", definition: "Maintain professional decorum and supervisory oversight at all times." }
          ],
          options: [
            "Allows stop-and-frisk based on reasonable suspicion for weapons.",
            "Evidence obtained unlawfully is inadmissible in court",
            "Requires advising suspects of rights before custodial interrogation.",
            "Forbids deadly force against fleeing suspect unless imminent threat exists.",
            "Traffic violations justify traffic stops regardless of officer motive",
            "Searches beyond immediate control require warrant or exception",
            "Passengers are seized during traffic stops",
            "Objective reasonableness under totality of circumstances",
            "Duty to reduce necessity for force when feasible",
            "Maintain professional decorum and supervisory oversight at all times."
          ]
        }
      ]
    },
    {
      sectionTitle: "SECTION C - MATCHING SET 2 (10 QUESTIONS)",
      questions: [
        {
          id: "match_set_2",
          type: "matching",
          points: 10,
          prompt: "Matching Set 2 - Supervisor Critical Incident Duties",
          pairs: [
            { id: "m2_1", term: "1. Deputy-Involved Shooting Initial Duty", definition: "Stabilize scene, separate involved deputies, preserve evidence, ensure mandatory notifications." },
            { id: "m2_2", term: "2. Felony Stop Supervisor Oversight Requirement", definition: "Confirm one-at-a-time extraction, heavy armor deployment and ensure field units are briefed." },
            { id: "m2_3", term: "3. Barricaded Suspect Patrol Supervisor Role", definition: "Maintain perimeter, manage optional patrol resources, coordinate with SEB leadership upon arrival." },
            { id: "m2_4", term: "4. Blue-on-Blue Incident Initial Supervisor Duty", definition: "Immediately cease all force, identify personnel, secure scene, and initiate proper notification." },
            { id: "m2_5", term: "5. K-9 Shot Supervisory Obligation", definition: "Treat it as a deputy-injury emergency and activate critical incident protocols." },
            { id: "m2_6", term: "6. Mobilization Phase I", definition: "Authorize optional heavy armor deployment and ensure field units are briefed." },
            { id: "m2_7", term: "7. Mobilization Phase II", definition: "Call next shift early, hold current shift over, and publish /HQ notification and Discord tac alert." },
            { id: "m2_8", term: "8. Hot Pursuit into Structure", definition: "Evaluate whether entry is warranted, clarify IC direction immediately, and assess whether suspect is armed." },
            { id: "m2_9", term: "9. Miranda / Admonition Issues", definition: "Ensure deputies follow correct advisement rules, especially with juveniles, and stop questioning when rights invoked." },
            { id: "m2_10", term: "10. SEB Activation — Supervisor Coordination", definition: "Request SEB appropriately, maintain containment until relieved, and avoid independent parallel action." }
          ],
          options: [
            "Stabilize scene, separate involved deputies, preserve evidence, ensure mandatory notifications.",
            "Confirm one-at-a-time extraction, heavy armor deployment and ensure field units are briefed.",
            "Maintain perimeter, manage optional patrol resources, coordinate with SEB leadership upon arrival.",
            "Immediately cease all force, identify personnel, secure scene, and initiate proper notification.",
            "Treat it as a deputy-injury emergency and activate critical incident protocols.",
            "Authorize optional heavy armor deployment and ensure field units are briefed.",
            "Call next shift early, hold current shift over, and publish /HQ notification and Discord tac alert.",
            "Evaluate whether entry is warranted, clarify IC direction immediately, and assess whether suspect is armed.",
            "Ensure deputies follow correct advisement rules, especially with juveniles, and stop questioning when rights invoked.",
            "Request SEB appropriately, maintain containment until relieved, and avoid independent parallel action."
          ]
        }
      ]
    },
    {
      sectionTitle: "SECTION D - SHORT ANSWERS / SCENARIOS (6 QUESTIONS)",
      questions: [
        { id: "sa_1", type: "short_answer", points: 5, prompt: "1. You arrive at an unfolding foot pursuit where two deputies have split in opposite directions, chasing multiple suspects. As the first supervisor on scene, what are your immediate responsibilities and decisions?" },
        { id: "sa_2", type: "short_answer", points: 5, prompt: "2. A deputy has deployed a 40mm round, striking a suspect in the head contrary to policy. What immediate actions must you take and why?" },
        { id: "sa_3", type: "short_answer", points: 5, prompt: "3. During a tactical standoff, SEB is en route but 12 minutes out. Patrol units request permission to breach because they 'see movement inside.' What must you do as IC?" },
        { id: "sa_4", type: "short_answer", points: 5, prompt: "4. At a mass-casualty incident, multiple agencies arrive with conflicting instruction styles. As the LSSD supervisor, what is your required approach?" },
        { id: "sa_5", type: "short_answer", points: 5, prompt: "5. During a deputy-involved shooting, two deputies give conflicting initial statements about the suspect's actions. What must a supervisor do to ensure a proper investigation?" },
        { id: "sa_6", type: "short_answer", points: 5, prompt: "6. Scenario: A deputy under your command repeatedly fails to submit Category 1 force documentation within prescribed shift timelines. Explain your progressive supervisory intervention and administrative routing." }
      ]
    }
  ];

  let candidateData = {};

  document.getElementById("authForm").addEventListener("submit", (e) => {
    e.preventDefault();
    
    candidateData = {
      name: document.getElementById("cadetName").value.trim(),
      badge: document.getElementById("badgeNumber").value.trim(),
      rank: document.getElementById("rank").value,
      assignment: document.getElementById("assignment").value.trim().toUpperCase()
    };

    if (!candidateData.name || !candidateData.badge || !candidateData.rank || !candidateData.assignment) {
      alert("Please fill out all mandatory fields before continuing.");
      return;
    }

    document.getElementById("warningModal").classList.add("active");
  });

  document.getElementById("modalConfirmBtn").addEventListener("click", () => {
    document.getElementById("warningModal").classList.remove("active");

    document.getElementById("dispName").innerText = `${candidateData.rank} ${candidateData.name}`;
    document.getElementById("dispBadge").innerText = `#${candidateData.badge}`;
    document.getElementById("dispStation").innerText = candidateData.assignment;

    document.getElementById("authSection").style.display = "none";
    document.getElementById("examSection").style.display = "block";
    window.scrollTo(0, 0);
  });

  const qContainer = document.getElementById("questionsContainer");

  function renderQuestion(q) {
    const block = document.createElement("div");
    block.className = "question-block";

    if (q.type === "mcq" || q.type === "tf") {
      block.innerHTML = `
        <div class="question-tag">${q.type === 'mcq' ? 'MULTIPLE CHOICE' : 'TRUE / FALSE'} • ${q.points} POINT</div>
        <div class="question-title">${q.prompt}</div>
        <div class="options">
          ${q.options.map((opt) => `
            <label class="option-label">
              <input type="radio" name="${q.id}" value="${opt}" required>
              <span>${opt}</span>
            </label>
          `).join("")}
        </div>
      `;
    } else if (q.type === "matching") {
      block.innerHTML = `
        <div class="question-tag">MATCHING SECTION • ${q.points} POINTS TOTAL</div>
        <div class="question-title">${q.prompt}</div>
        <div id="matchingRowsContainer">
          ${q.pairs.map((pair) => `
            <div class="matching-row">
              <div class="matching-prompt">${pair.term}</div>
              <div>
                <select name="match_${pair.id}" class="match-select" required>
                  <option value="" disabled selected>-- Select Definition --</option>
                  ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join("")}
                </select>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    } else if (q.type === "short_answer") {
      block.innerHTML = `
        <div class="question-tag">WRITTEN SCENARIO • ${q.points} POINTS (Max 500 chars)</div>
        <div class="question-title">${q.prompt}</div>
        <textarea name="${q.id}" id="${q.id}_txt" maxlength="500" placeholder="Type test response (max 500 chars)..."></textarea>
        <div class="counter-bar">
          <span id="${q.id}_words">0 words</span>
          <span id="${q.id}_chars">0 / 500 characters</span>
        </div>
      `;

      setTimeout(() => {
        const textarea = document.getElementById(`${q.id}_txt`);
        const wordEl = document.getElementById(`${q.id}_words`);
        const charEl = document.getElementById(`${q.id}_chars`);

        if (textarea && wordEl && charEl) {
          textarea.addEventListener("input", () => {
            const val = textarea.value;
            const charCount = val.length;
            const words = val.trim().length > 0 ? val.trim().split(/\s+/).length : 0;

            wordEl.innerText = `${words} word${words === 1 ? '' : 's'}`;
            charEl.innerText = `${charCount} / 500 characters`;
          });
        }
      }, 50);
    }
    qContainer.appendChild(block);
  }

  examStructure.forEach((sec) => {
    const secHeader = document.createElement("div");
    secHeader.className = "section-separator";
    secHeader.innerText = sec.sectionTitle;
    qContainer.appendChild(secHeader);

    sec.questions.forEach(q => renderQuestion(q));
  });

  document.getElementById("quizForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");

    submitBtn.disabled = true;
    statusDiv.style.color = "var(--text-muted)";
    statusDiv.innerText = "Submitting examination to Discord...";

    // 1. Auto-grade Section A (30 MCQ) & Section B (20 TF)
    let autoScore = 0;
    const maxAutoScore = 70; // 30 MCQ + 20 TF + 20 Matching items = 70 total auto points

    examStructure[0].questions.forEach((q) => {
      const selected = document.querySelector(`input[name="${q.id}"]:checked`)?.value;
      if (selected === q.correct) { autoScore += q.points; }
    });

    examStructure[1].questions.forEach((q) => {
      const selected = document.querySelector(`input[name="${q.id}"]:checked`)?.value;
      if (selected === q.correct) { autoScore += q.points; }
    });

    // 2. Auto-grade Matching Sets 1 & 2 (10 items each)
    examStructure[2].questions.forEach((q) => {
      q.pairs.forEach((pair) => {
        const selectedDef = document.querySelector(`select[name="match_${pair.id}"]`)?.value;
        if (selectedDef === pair.definition) { autoScore += 1; }
      });
    });

    examStructure[3].questions.forEach((q) => {
      q.pairs.forEach((pair) => {
        const selectedDef = document.querySelector(`select[name="match_${pair.id}"]`)?.value;
        if (selectedDef === pair.definition) { autoScore += 1; }
      });
    });

    const autoPercentage = Math.round((autoScore / maxAutoScore) * 100);
    const isPassing = autoPercentage >= 60;
    const statusSymbol = isPassing ? "✅" : "❌";
    const statusText = isPassing ? "Passing" : "Failing";

    // 3. Gather Written Scenarios (Section D)
    const shortAnswerResponses = [];
    examStructure[4].questions.forEach((q) => {
      let textVal = document.querySelector(`textarea[name="${q.id}"]`)?.value?.trim();
      if (textVal && textVal.length > 500) {
        textVal = textVal.substring(0, 500);
      }
      shortAnswerResponses.push({
        prompt: q.prompt,
        answer: textVal && textVal.length > 0 ? textVal : "No answer provided."
      });
    });

    const nowString = new Date().toUTCString();

    const summaryEmbed = {
      title: "BSSS Entrance Examination — Submission",
      description: `Candidate: **${candidateData.rank} ${candidateData.name}**\nBadge: \`#${candidateData.badge}\` | Assignment: \`${candidateData.assignment}\`\n\n> **DISCLAIMER:** Grade manual responses directly from this thread. Do not share outside BSSS Management.\n\n⚠️ **Please grade and tally manual questions below and add it to the total from the auto graded.**\n*(Manual Section: 6 questions × 5 points = 30 total)*`,
      color: isPassing ? 0x22c55e : 0xef4444,
      fields: [
        { name: "Auto-Score", value: `**${autoScore} / ${maxAutoScore}**`, inline: true },
        { name: "Percentage", value: `**${autoPercentage}%**`, inline: true },
        { name: "Status", value: `${statusSymbol} **${statusText}**`, inline: true }
      ],
      footer: { text: `LSSD Advanced Officer Training Unit - BSSS - ${nowString}` },
      timestamp: new Date().toISOString()
    };

    const scenarioEmbeds = shortAnswerResponses.map((sa, idx) => ({
      title: `Written Scenario ${idx + 1} of 6`,
      description: `**Question:**\n> ${sa.prompt}`,
      color: 0xc5a059,
      fields: [
        {
          name: "Candidate Response",
          value: `\`\`\`text\n${sa.answer}\n\`\`\``,
          inline: false
        }
      ],
      footer: { text: `BSSS Management • Scenario ${idx + 1} Evaluation` }
    }));

    const forumThreadTitle = `${candidateData.name} - ${candidateData.assignment}`;

    try {
      const payload = {
        thread_name: forumThreadTitle,
        content: `<@&${ROLE_ID_TO_PING}> **New BSSS Exam Submission Received:**`,
        username: "LSSD AOTU - BSSS Management",
        avatar_url: BOT_AVATAR_URL,
        allowed_mentions: { roles: [ROLE_ID_TO_PING] },
        embeds: [summaryEmbed, ...scenarioEmbeds]
      };

      const response = await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (response.ok || response.status === 201 || response.status === 200) {
        statusDiv.style.color = "var(--pass)";
        statusDiv.innerText = "Examination Submitted - You may close this window now.";
      } else {
        const errText = await response.text();
        console.error("Discord Error:", response.status, errText);
        statusDiv.style.color = "var(--fail)";
        statusDiv.innerText = `❌ Discord Error (${response.status}): Check console for details.`;
        submitBtn.disabled = false;
      }
    } catch (err) {
      console.error("Network / CORS error:", err);
      statusDiv.style.color = "var(--fail)";
      statusDiv.innerText = "❌ Network error. Check console logs.";
      submitBtn.disabled = false;
    }
  });
</script>
